<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magdalena & Bartolomé · 30 de octubre de 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7f3ea;color:#3f503b}
body{font-family:Georgia,"Times New Roman",serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.envelope-wrap{position:relative;width:min(92vw,620px);height:min(64vw,430px);min-height:300px;display:flex;align-items:center;justify-content:center}
.envelope{position:relative;width:82%;height:68%;background:linear-gradient(145deg,#fbf8f0,#eee4d4);border:1px solid #d8cbb7;border-radius:4px;box-shadow:0 18px 35px rgba(74,58,38,.18);transform:translateY(8px);transition:opacity .8s,transform .8s}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#e2d5c2 50%,transparent 50.5%),linear-gradient(225deg,transparent 49.5%,#e2d5c2 50%,transparent 50.5%);opacity:.65}
.flap{position:absolute;left:0;right:0;top:0;height:55%;background:#f8f1e5;clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:1px solid #d8cbb7;transform-origin:top center;transition:transform 1.2s cubic-bezier(.2,.75,.2,1);z-index:3}
.seal{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-35%);width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a87342,#70411f 70%,#4d2c18);box-shadow:0 5px 10px rgba(50,30,15,.3),inset 0 0 0 4px rgba(235,195,135,.3);display:flex;align-items:center;justify-content:center;color:#f2d7aa;font-size:25px;letter-spacing:1px;font-family:Georgia,serif}
.hint{position:absolute;bottom:5%;left:0;right:0;text-align:center;color:#6d624f;font-size:14px;letter-spacing:.4px}
.invitation{display:none;position:relative;width:min(92vw,709px);margin:0 auto}
.invitation img{display:block;width:100%;height:auto}
.countdown{position:absolute;left:13.73%;top:64.15%;width:72.54%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.05%;z-index:5;pointer-events:none}
.box{border:1px solid #ded5c4;border-radius:15px;background:#fbf8f1;aspect-ratio:1.18/1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3f503b;line-height:1;font-family:Georgia,"Times New Roman",serif}
.label{font-size:clamp(8px,1.6vw,14px);letter-spacing:1.4px}.num{font-size:clamp(27px,5.5vw,48px);margin:7px 0}.unit{font-size:clamp(8px,1.45vw,13px)}
.link{position:absolute;z-index:10;display:block;-webkit-tap-highlight-color:transparent}
.maps1{left:18.9%;top:79.88%;width:23.5%;height:2.25%}
.maps2{left:57.8%;top:77.28%;width:23.3%;height:2.15%}
.form{left:22.3%;top:91.55%;width:55%;height:2.65%}
@media(max-width:500px){
.maps1{top:79.88%;height:2.35%}
.maps2{top:77.28%;height:2.3%}
.form{top:91.55%;height:2.8%}
}
body.open .flap{transform:rotateX(180deg)}
body.open .seal{opacity:0;transition:opacity .35s}
body.open .envelope{opacity:0;transform:translateY(-12px)}
body.open .stage{display:none}
body.open .invitation{display:block}
</style>
</head>
<body>
<div class="stage" aria-label="Sobre de invitación">
  <div class="envelope-wrap">
    <div class="envelope">
      <div class="flap"></div>
      <div class="seal">M&amp;B</div>
    </div>
    <div class="hint">Nuestra invitación se abrirá automáticamente…</div>
  </div>
</div>

<div class="invitation">
  <img src="invitacion.png" alt="Invitación de boda de Magdalena y Bartolomé">
  <div class="countdown" aria-label="Cuenta atrás">
    <div class="box"><span class="label">DÍAS</span><span class="num" id="days">0</span><span class="unit">DÍAS</span></div>
    <div class="box"><span class="label">HORAS</span><span class="num" id="hours">00</span><span class="unit">HORAS</span></div>
    <div class="box"><span class="label">MINUTOS</span><span class="num" id="minutes">00</span><span class="unit">MINUTOS</span></div>
    <div class="box"><span class="label">SEGUNDOS</span><span class="num" id="seconds">00</span><span class="unit">SEGUNDOS</span></div>
  </div>
  <a class="link maps1" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=Parroquia%20Santa%20Catalina%2C%20Plaza%20de%20la%20Iglesia%208%2C%2014400%20Pozoblanco%2C%20C%C3%B3rdoba" aria-label="Google Maps ceremonia"></a>
  <a class="link maps2" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&amp;query=C%2F%20Cronista%20Sep%C3%BAlveda%2016%2C%2014400%20Pozoblanco%2C%20C%C3%B3rdoba" aria-label="Google Maps celebración"></a>
  <a class="link form" target="_blank" rel="noopener noreferrer" href="https://docs.google.com/forms/d/e/1FAIpQLSezatcEja2CcOIFN9_i3sMrSfBncHwaiElb7RoRsyf85n1b3g/viewform?usp=header" aria-label="Formulario de confirmación"></a>
</div>

<script>
const target=new Date("2027-10-30T13:00:00");
function update(){
  let d=Math.max(0,target-new Date());
  document.getElementById("days").textContent=Math.floor(d/86400000);
  document.getElementById("hours").textContent=String(Math.floor(d/3600000)%24).padStart(2,"0");
  document.getElementById("minutes").textContent=String(Math.floor(d/60000)%60).padStart(2,"0");
  document.getElementById("seconds").textContent=String(Math.floor(d/1000)%60).padStart(2,"0");
}
update(); setInterval(update,1000);
setTimeout(()=>document.body.classList.add("open"),1800);
</script>
</body>
</html>
