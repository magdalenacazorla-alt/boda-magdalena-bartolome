<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f0e5">
<title>Magdalena & Bartolomé · 30 octubre 2027</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a href="#inicio" class="monogram">M <span>|</span> B</a>
</header>

<main>
  <section id="inicio" class="visual-section">
    <img src="assets/boceto1.jpg" alt="Queremos contar contigo" class="art">
    <a class="hotspot rsvp" href="https://docs.google.com/forms/d/e/1FAIpQLSezatcEja2CcOIFN9_i3sMrSfBncHwaiElb7RoRsyf85n1b3g/viewform?usp=header" target="_blank" rel="noopener" aria-label="Confirmar asistencia"></a>
  </section>

  <nav class="quick">
    <a href="#inicio">Inicio</a>
    <a href="#historia">Nuestra historia</a>
    <a href="#gran-dia">Ceremonia</a>
    <a href="#gran-dia">Celebración</a>
    <a href="#musica">Música</a>
  </nav>

  <section id="historia" class="visual-section historia">
    <img src="assets/boceto2.jpg" alt="Nuestra historia" class="art">
    <div class="countdown-overlay" aria-live="polite" aria-label="Cuenta atrás para la boda">
      <span id="days">000</span>
      <span id="hours">00</span>
      <span id="minutes">00</span>
      <span id="seconds">00</span>
    </div>
  </section>

  <section id="gran-dia" class="visual-section">
    <img src="assets/boceto3.jpg" alt="El gran día: ceremonia y celebración" class="art">

    <a class="hotspot church" href="https://maps.app.goo.gl/xHgj4gmNdY5xVuDF8?g_st=iw" target="_blank" rel="noopener" aria-label="Ver ubicación de Iglesia de Santa Catalina"></a>

    <a class="hotspot salon" href="https://maps.app.goo.gl/6A2Yip8pyDELnHQh7" target="_blank" rel="noopener" aria-label="Ver ubicación de Salón Calablanca Catering"></a>
  </section>

  <section id="musica" class="visual-section">
    <img src="assets/boceto4.jpg" alt="La banda sonora de nuestra boda" class="art">
    <a class="hotspot song" href="https://docs.google.com/forms/d/e/1FAIpQLSdvG4KMufW9Qk8n-_mG172C8Th-fCzwPsbaE65mmpSRMWJxOw/viewform?usp=header" target="_blank" rel="noopener" aria-label="Sugerir una canción"></a>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
