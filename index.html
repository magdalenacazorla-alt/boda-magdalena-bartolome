<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magdalena & Bartolomé · 30 de octubre de 2027</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7f2e9}
.page{position:relative;width:min(100vw,862px);margin:auto;line-height:0}
.model{display:block;width:100%;height:auto}
a.hot,button.hot{position:absolute;display:block;border:0;background:transparent;padding:0;margin:0;cursor:pointer;z-index:3}
a.hot:focus-visible,button.hot:focus-visible{outline:2px solid #59644b;outline-offset:2px;border-radius:10px}
.count-live{position:absolute;left:18.5%;top:52.4%;width:63%;height:5.1%;display:flex;gap:2.5%;z-index:4;pointer-events:none}
.count-live .box{flex:1;background:#fffdf8;border:1px solid #e2d8c8;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.count-live .n{font:700 27px Georgia,serif;color:#59644b}
.count-live .u{font:10px Arial,sans-serif;color:#555;margin-top:5px;letter-spacing:.05em}
.map-cer{left:21%;top:68.55%;width:17%;height:3.2%}
.map-cele{left:57.5%;top:70.25%;width:18%;height:3.2%}
.confirm-open{left:17%;top:79.0%;width:65%;height:4.8%;background:#fff0!important;border-radius:16px}
.confirm-label{position:absolute;left:29%;top:76.8%;width:42%;height:2.8%;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;font:600 11px Arial,sans-serif;letter-spacing:.08em;color:#59644b;text-transform:uppercase}
.music-hot{left:13%;top:91.0%;width:13%;height:5.5%}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.overlay.show{display:flex}
.sheet{width:min(720px,100%);height:min(90svh,800px);margin:auto auto 0;background:#fffaf2;border-radius:25px 25px 0 0;overflow:hidden;box-shadow:0 -10px 40px #0004}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #ded3c2;color:#59644b;font:17px Georgia,serif}
.close{border:0;background:none;font-size:28px;color:#777;cursor:pointer}
iframe{width:100%;height:calc(100% - 56px);border:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#59644b;color:#fff;padding:11px 16px;border-radius:999px;font:13px Arial,sans-serif;display:none;z-index:30;max-width:90%;text-align:center}
.toast.show{display:block}
@media(max-width:500px){.count-live .n{font-size:22px}.count-live .u{font-size:9px}.confirm-label{font-size:9px}}
</style>
</head>
<body>
<main class="page">
<img class="model" src="modelo.png" alt="Invitación de boda de Magdalena y Bartolomé">

<div class="count-live" aria-label="Cuenta atrás">
  <div class="box"><span class="n" id="days">0</span><span class="u">DÍAS</span></div>
  <div class="box"><span class="n" id="hours">00</span><span class="u">HORAS</span></div>
  <div class="box"><span class="n" id="mins">00</span><span class="u">MINUTOS</span></div>
  <div class="box"><span class="n" id="secs">00</span><span class="u">SEGUNDOS</span></div>
</div>

<a class="hot map-cer" aria-label="Cómo llegar a la ceremonia"
 href="https://www.google.com/maps/dir/?api=1&destination=Plaza%20de%20la%20Iglesia%209%2C%2014400%20Pozoblanco%2C%20Cordoba" target="_blank" rel="noopener"></a>

<a class="hot map-cele" aria-label="Cómo llegar a la celebración"
 href="https://www.google.com/maps/dir/?api=1&destination=C.%20Cronista%20Sepulveda%207%2C%2014400%20Pozoblanco%2C%20Cordoba" target="_blank" rel="noopener"></a>

<div class="confirm-label">TOCA AQUÍ PARA CONFIRMAR</div>
<button class="hot confirm-open" aria-label="Abrir confirmación de asistencia" onclick="openForm()"></button>

<a class="hot music-hot" aria-label="Experience de Ludovico Einaudi"
 href="https://open.spotify.com/search/Experience%20Ludovico%20Einaudi" target="_blank" rel="noopener"></a>
</main>

<div class="overlay" id="ov" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <div class="bar"><span>💌 Confirmación · Magdalena & Bartolomé</span><button class="close" onclick="closeForm()">×</button></div>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSezatcEja2CcOIFN9_i3sMrSfBncHwaiElb7RoRsyf85n1b3g/viewform?usp=dialog" title="Confirmación de asistencia"></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const target=new Date("2027-10-30T13:00:00+02:00").getTime();
function tick(){
 let d=Math.max(0,target-Date.now());
 document.getElementById("days").textContent=Math.floor(d/86400000);
 document.getElementById("hours").textContent=String(Math.floor(d%86400000/3600000)).padStart(2,"0");
 document.getElementById("mins").textContent=String(Math.floor(d%3600000/60000)).padStart(2,"0");
 document.getElementById("secs").textContent=String(Math.floor(d%60000/1000)).padStart(2,"0");
}
tick();setInterval(tick,1000);
function openForm(){document.getElementById("ov").classList.add("show")}
function closeForm(){document.getElementById("ov").classList.remove("show")}
</script>
</body>
</html>
