<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Magdalena & Bartolomé · 30 de octubre de 2027</title>
<style>
html,body{margin:0;background:#f7f3ea}
body{font-family:Georgia,"Times New Roman",serif}
.invite{position:relative;width:100%;max-width:853px;margin:auto;line-height:0}
.base{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;z-index:3}
.countdown{position:absolute;z-index:4;left:13.7%;top:56.45%;width:72.7%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.8%}
.time{height:auto;aspect-ratio:1.18/1;border:1px solid #ded5c4;border-radius:15px;background:rgba(251,248,241,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3f503b;line-height:1}
.time .n{font-size:clamp(22px,5.3vw,48px);margin:5px 0}
.time .u,.time .small{font-size:clamp(7px,1.45vw,13px);letter-spacing:1px}
.time .small{font-size:clamp(8px,1.6vw,14px);letter-spacing:1.3px}
.form{left:21.8%;top:91.25%;width:56.4%;height:4.5%;border-radius:12px}
.map1{left:18.3%;top:80.55%;width:23.5%;height:3.2%;border-radius:10px}
.map2{left:58.5%;top:80.55%;width:23.5%;height:3.2%;border-radius:10px}
.nav{position:absolute;z-index:5;left:4%;top:24.4%;width:92%;height:5.4%;display:flex}
.nav a{flex:1;color:transparent}
.nav a:focus-visible{outline:2px solid #3f503b}
.music{left:84%;top:24.4%;width:12%;height:5.4%}
.story{left:0;top:27%;width:100%;height:27%}
@media(min-width:853px){
 .time .n{font-size:48px}.time .small{font-size:14px}.time .u{font-size:13px}
}
</style>
</head>
<body>
<div class="invite">
  <img class="base" src="invitacion-base.png" alt="Invitación de boda de Magdalena y Bartolomé">
  <div class="countdown" aria-label="Cuenta atrás">
    <div class="time"><span class="small">DÍAS</span><span class="n" id="days">000</span><span class="u">DÍAS</span></div>
    <div class="time"><span class="small">HORAS</span><span class="n" id="hours">00</span><span class="u">HORAS</span></div>
    <div class="time"><span class="small">MINUTOS</span><span class="n" id="minutes">00</span><span class="u">MINUTOS</span></div>
    <div class="time"><span class="small">SEGUNDOS</span><span class="n" id="seconds">00</span><span class="u">SEGUNDOS</span></div>
  </div>

  <!-- Navegación invisible sobre el diseño aprobado -->
  <nav class="nav" aria-label="Navegación">
    <a href="#historia" aria-label="Nuestra historia"></a>
    <a href="#cuenta" aria-label="Cuenta atrás"></a>
    <a href="#ceremonia" aria-label="Ceremonia"></a>
    <a href="#celebracion" aria-label="Celebración"></a>
    <a href="#donde" aria-label="Dónde"></a>
    <a href="#confirmacion" aria-label="Confirmación"></a>
    <a href="#musica" aria-label="Música"></a>
  </nav>

  <a class="hotspot map1" id="map1" target="_blank" rel="noopener"
     href="https://www.google.com/maps/search/?api=1&query=Parroquia%20Santa%20Catalina%2C%20Plaza%20de%20la%20Iglesia%209%2C%2014400%20Pozoblanco%2C%20C%C3%B3rdoba"
     aria-label="Abrir ubicación de la ceremonia en Google Maps"></a>

  <a class="hotspot map2" id="map2" target="_blank" rel="noopener"
     href="https://www.google.com/maps/search/?api=1&query=Catering%20Calablanca%2C%20C%2F%20Cronista%20Sep%C3%BAlveda%207%2C%2014400%20Pozoblanco%2C%20C%C3%B3rdoba"
     aria-label="Abrir ubicación de Catering Calablanca en Google Maps"></a>

  <a class="hotspot form" id="formLink"
     href="https://docs.google.com/forms/d/e/1FAIpQLSezatcEja2CcOIFN9_i3sMrSfBncHwaiElb7RoRsyf85n1b3g/viewform?usp=header"
     target="_blank" rel="noopener"
     aria-label="Abrir formulario de confirmación"
     onclick="playExperience()"> </a>

  <span id="historia" class="hotspot story" aria-hidden="true"></span>
  <span id="cuenta" class="hotspot" style="left:0;top:54%;width:100%;height:12%" aria-hidden="true"></span>
  <span id="ceremonia" class="hotspot" style="left:10%;top:68%;width:38%;height:15%" aria-hidden="true"></span>
  <span id="celebracion" class="hotspot" style="left:52%;top:68%;width:38%;height:15%" aria-hidden="true"></span>
  <span id="donde" class="hotspot" style="left:0;top:68%;width:100%;height:16%" aria-hidden="true"></span>
  <span id="confirmacion" class="hotspot" style="left:0;top:84%;width:100%;height:14%" aria-hidden="true"></span>
  <span id="musica" class="hotspot" style="left:0;top:88%;width:100%;height:10%" aria-hidden="true"></span>

  <iframe id="audio" title="Experience — Ludovico Einaudi" allow="autoplay"
          style="position:fixed;width:1px;height:1px;left:-10px;bottom:-10px;border:0;opacity:0"></iframe>
</div>
<script>
const target = new Date("2027-10-30T13:00:00");
function tick(){
  let d=target-new Date();
  if(d<0)d=0;
  const vals=[
    Math.floor(d/86400000),
    Math.floor(d/3600000)%24,
    Math.floor(d/60000)%60,
    Math.floor(d/1000)%60
  ];
  ["days","hours","minutes","seconds"].forEach((id,i)=>{
    document.getElementById(id).textContent=String(vals[i]).padStart(i===0?3:2,"0");
  });
}
tick();setInterval(tick,1000);

function playExperience(){
  // Official Ludovico Einaudi YouTube recording of Experience.
  const id="2MHsDNV9lgY";
  document.getElementById("audio").src=
    "https://www.youtube.com/embed/"+id+"?autoplay=1&loop=1&playlist="+id+"&controls=0";
}
</script>
</body>
</html>
